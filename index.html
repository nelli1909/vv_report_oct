<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Выводы по динамике сетей</title>
<style>
  :root{--green:#2DBE64;--green-d:#1E8A4A;--ink:#1D2821;--muted:#78867D;--line:#E2E9E4;--bg:#EEF2EF;--neg:#E5484D}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
  form{background:#fff;border-radius:14px;box-shadow:0 6px 28px rgba(20,60,35,.14);padding:28px 28px 24px;width:100%;max-width:380px}
  h1{margin:0 0 6px;font-size:20px;color:#13532D}
  p{margin:0 0 18px;font-size:14px;color:var(--muted)}
  input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px}
  input:focus{outline:none;border-color:var(--green)}
  button{margin-top:12px;width:100%;height:42px;border:0;border-radius:10px;background:var(--green);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button:hover{background:var(--green-d)}
  button:disabled{opacity:.6;cursor:wait}
  .err{min-height:18px;margin-top:10px;font-size:13px;color:var(--neg)}
</style></head>
<body><div class="wrap">
<form id="f" autocomplete="off">

  <input id="pw" type="password" placeholder="Пароль" autofocus required>
  <button id="go" type="submit">Открыть</button>
  <div class="err" id="err"></div>
</form></div>

function b64(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
async function gunzip(bytes){
  var ds=new DecompressionStream('gzip');
  var stream=new Blob([bytes]).stream().pipeThrough(ds);
  return await new Response(stream).text();
}
document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault();
  var btn=document.getElementById('go'), err=document.getElementById('err');
  btn.disabled=true; err.textContent='';
  try{
    var base=await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.it, hash:'SHA-256'},
                                          base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.data));
    var html=await gunzip(new Uint8Array(plain));
    document.open(); document.write(html); document.close();
  }catch(ex){
    err.textContent = (ex && ex.name==='OperationError') ? 'Неверный пароль' : 'Не удалось открыть: '+(ex && ex.message || ex);
    btn.disabled=false;
  }
});
